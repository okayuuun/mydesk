name: Deploy MyDesk and refresh game news
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 約6時間ごと（UTC）
    - cron: '17 */6 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mydesk-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update headlines from public RSS (best effort)
        run: |
          python scripts/update_news.py || echo 'RSS取得失敗: 最新ニュースなしの状態でサイトを公開します'
      - name: Build static public directory
        run: |
          mkdir -p _site/icons
          cp index.html style.css app.js features.js extras.js manifest.webmanifest sw.js news.json _site/
          cp icons/*.png _site/icons/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
